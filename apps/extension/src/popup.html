<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      body { font: 13px/1.4 system-ui, sans-serif; width: 320px; margin: 0; padding: 12px; color: #1c1917; }
      h1 { font-size: 15px; margin: 0 0 8px; display: flex; gap: 6px; align-items: center; }
      label { display: block; margin: 8px 0 2px; color: #57534e; }
      input { width: 100%; box-sizing: border-box; padding: 6px 8px; border: 1px solid #d6d3d1; border-radius: 6px; }
      button { margin-top: 10px; width: 100%; padding: 8px; border: 0; border-radius: 6px; background: #0f766e; color: white; font-weight: 600; cursor: pointer; }
      button.stop { background: #b91c1c; }
      .status { margin-top: 10px; padding: 8px; border-radius: 6px; background: #f5f5f4; }
      .replies { margin-top: 8px; max-height: 160px; overflow: auto; white-space: pre-wrap; }
      .replies div { border-top: 1px solid #e7e5e4; padding: 4px 0; }
      .note { color: #78716c; font-size: 12px; margin-top: 8px; }
      a { color: #0f766e; }
    </style>
  </head>
  <body>
    <h1><img src="icon.png" width="18" height="18" alt="" /> Open Meetings</h1>
    <label for="server">Server</label>
    <input id="server" placeholder="http://localhost:4319" />
    <label for="token">Token (if the server has one)</label>
    <input id="token" type="password" />
    <label for="title">Title</label>
    <input id="title" placeholder="Uses the tab title when empty" />
    <button id="toggle" type="button">Capture this tab</button>
    <div class="status" id="status">Not capturing.</div>
    <div class="replies" id="replies"></div>
    <p class="note">
      No participant joins the call: the audio of this tab (and, on Google Meet, the captions) goes
      to your server. Tell the others the meeting is being transcribed.
    </p>
    <script src="popup.js" type="module"></script>
  </body>
</html>
