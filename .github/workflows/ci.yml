name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The bot tests drive a real Chromium against a fake Meet page.
      - run: pnpm --filter @open-meetings/bot exec playwright install --with-deps chromium
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Start the built bundles
        run: node scripts/smoke-dist.mjs
      - name: Replay a recorded meeting with the built CLI
        run: node apps/server/dist/main.js replay weekly-sync --mock
