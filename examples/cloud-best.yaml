# Profile: cloud-best. Quality first: a capable small model for the continuous loop and a
# frontier model for commands and the final minutes. Run `om doctor` for the cost per hour.
profile: cloud-best

engines:
  llm:
    fast:
      provider: anthropic
      model: claude-haiku-5-5
      apiKey: "${ANTHROPIC_API_KEY}"
    smart:
      provider: anthropic
      model: claude-opus-5-5
      apiKey: "${ANTHROPIC_API_KEY}"
  stt:
    provider: none # uses Meet captions
  tts:
    provider: openai-compatible
    baseUrl: https://api.openai.com/v1
    model: gpt-4o-mini-tts
    apiKey: "${OPENAI_API_KEY}"
  embed:
    provider: openai-compatible
    baseUrl: https://api.openai.com/v1
    model: text-embedding-3-small
    apiKey: "${OPENAI_API_KEY}"

pricing:
  claude-haiku-5-5: { in: 0.10, out: 0.50 }
  claude-opus-5-5: { in: 4.00, out: 20.00 }

agent:
  language: pt-BR
  proactive: true
